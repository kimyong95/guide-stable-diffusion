# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  max_epochs: 300
  logger:
    class_path: WandbLogger
    init_args:
      project: finetune-stable-diffusion
      name: finetune-with-optimization
  callbacks:
  - class_path: WandbModelCheckpoint
    init_args:
      monitor: "train/score_mean"
      mode: max
      save_top_k: -1
      save_last: True
      every_n_epochs: 10
      filename: '{epoch:03d}'
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.finetune_with_optimization.FinetuneDiffusionWithOptimization
  init_args:
    sd_model: sdxl-lightning
    lr: 50
    training_batch_size: 32
    validation_batch_size: 16
    generate_prompt: "A yellow reindeer and a blue elephant."
    reward_target_prompt: 
      1.0: "A yellow reindeer and a blue elephant."
    reward_func: "gemini-question"
    reward_query_prompt: null