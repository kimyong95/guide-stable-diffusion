# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  max_epochs: 500
  logger:
    class_path: WandbLogger
    init_args:
      project: finetune-stable-diffusion
      name: finetune-with-optimization
  callbacks:
  - class_path: WandbModelCheckpoint
    init_args:
      monitor: "train/score_mean"
      mode: min
      save_top_k: -1
      save_last: True
      every_n_epochs: 10
      filename: '{epoch:03d}'
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.finetune_with_optimization.FinetuneDiffusionWithOptimization
  init_args:
    sd_model: sd3
    lr: 100
    training_batch_size: 32
    validation_batch_size: 16
    generate_prompt: "A realistic photo showing a yellow reindeer and a blue elephant playing with ball on a beach, the eleplant is carrying the ball with his trunk."
    reward_target_prompt:
    - "A realistic photo showing a yellow reindeer and a blue elephant."
    - "A realistic photo showing a yellow reindeer and a blue elephant playing with ball."
    - "A realistic photo showing a yellow reindeer and a blue elephant playing with ball on a beach."
    - "A realistic photo showing a yellow reindeer and a blue elephant playing with ball on a beach, the eleplant is carrying the ball with his trunk."
    reward_func: "gemini-question"
    reward_query_prompt: null
    evaluate_intermidiate_steps: False