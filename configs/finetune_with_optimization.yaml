# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  max_epochs: 1000
  logger:
    class_path: WandbLogger
    init_args:
      project: finetune-stable-diffusion
      name: finetune-with-optimization
  callbacks:
  - class_path: ModelCheckpoint
    init_args:
      every_n_epochs: 10
      save_top_k: -1
      filename: '{epoch:03d}'
      save_on_train_epoch_end: True
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.finetune_with_optimization.FinetuneDiffusionWithOptimization
  init_args:
    compile: True
    sd_model: sdxl-ddim
    lr: 200
    projection: True
    training_batch_size: 32
    validation_batch_size: 16
    generate_prompt: "A robotic cat and a robotic dog playing with a football on the moon. The cat wearing a hat, and dog wearing a scarf."
    reward_target_prompts:
    - "They playing with football on the moon."
    - "A robotic cat and a robotic dog playing with a football on the moon."
    - "A robotic cat and a robotic dog playing with a football on the moon. The dog wearing a scarf."
    - "A robotic cat and a robotic dog playing with a football on the moon. The cat wearing a hat, and dog wearing a scarf."
    reward_func: "gemini-question"
    reward_query_prompt: "Does the prompt '{target_prompt}' accurately describe the image? Answer score=0 (no) or score=1 (yes).\nAnswer in the format: Score=score, Reason=reason."
    max_reward_value: 1.0
    evaluate_intermidiate_steps: False