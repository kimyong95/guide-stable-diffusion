# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  max_epochs: 50
  logger:
    class_path: WandbLogger
    init_args:
      project: finetune-targetdiff
      name: finetune-targetdiff # finetune-targetdiff-with-model
  callbacks:
  - class_path: WandbModelCheckpoint
    init_args:
      monitor: "train/score_mean"
      mode: max
      save_top_k: -1
      save_last: True
      every_n_epochs: 10
      filename: '{epoch:03d}'
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.finetune_targetdiff_with_model.FinetuneTargetdiffWithModel
  init_args:
    guidance_model: "gp"
    training_batch_size: 32
    validation_batch_size: 16
    alpha: 10 # guidance step
    reg_mode: "projection"
    reg: 1e-3
