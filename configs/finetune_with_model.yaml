# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  max_epochs: 100
  logger:
    class_path: WandbLogger
    init_args:
      project: finetune-stable-diffusion
      name: finetune-with-model
  callbacks:
  - class_path: WandbModelCheckpoint
    init_args:
      monitor: "train/score_mean"
      mode: max
      save_top_k: -1
      save_last: True
      every_n_epochs: 10
      filename: '{epoch:03d}'
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.finetune_with_model.FinetuneDiffusionWithModel
  init_args:
    guidance_model: "gp"
    sd_model: sdxl-lightning
    training_batch_size: 32
    validation_batch_size: 16
    alpha: 80 # guidance step
    reg_mode: "projection"
    reg: 1e-3
    generate_prompt: "A yellow reindeer, a blue elephant, a puppy."
    reward_target_prompt: "A yellow reindeer, a blue elephant, a puppy."
    reward_func: "gemini-question"
    reward_query_prompt: null