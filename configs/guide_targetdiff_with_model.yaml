# pytorch cli config
seed_everything: 0

trainer:
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  max_epochs: 50
  logger:
    class_path: WandbLogger
    init_args:
      project: guide-targetdiff
      name: guide-targetdiff # guide-targetdiff-with-model
  callbacks:
  - class_path: WandbModelCheckpoint
    init_args:
      monitor: "train/score_mean"
      mode: max
      save_top_k: -1
      save_last: True
      every_n_epochs: 10
      filename: '{epoch:03d}'
data:
  class_path: datamodule.DummyDataModule
  init_args: {}
model:
  class_path: models.guide_targetdiff_with_model.GuideTargetdiffWithModel
  init_args:
    guidance_model: "best"
    alpha: 0.1 # guidance step
    training_batch_size: 32
    validation_batch_size: 16
    pos_only: True
    reg_mode: "projection"
    reg: 1e-3
    data_id: 0
    scheduler: "guide-eular"
    # vina_web_url: https://foydiwfg7gjyejxzapwso5czuu0jzxwt.lambda-url.us-east-2.on.aws
    vina_web_url: https://qylhug6f6qwh7xbs5zsewfzwi40hktit.lambda-url.ap-southeast-1.on.aws
    